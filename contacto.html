<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hablemos de tu proyecto | BRIMADEN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="form-page">

<div class="form-page-container">

<img src="img/B dorada brimaden.png" class="form-logo" alt="BRIMADEN">

<p class="mini-title">
CONTANOS SOBRE TU PROYECTO
</p>

<h1>
Hablemos de tu proyecto
</h1>

<p class="description">
Completá estos datos y nos pondremos en contacto con vos a la brevedad.
</p>

<form
name="contacto"
method="POST"
data-netlify="true"
action="/gracias.html">

<input type="hidden"
name="form-name"
value="contacto">

<input
type="text"
name="nombre"
placeholder="Nombre"
required>

<input
type="email"
name="email"
placeholder="Correo electrónico"
required>

<input
type="text"
name="whatsapp"
placeholder="WhatsApp"
required>

<select name="servicio">

<option selected disabled>
¿Qué necesitás?
</option>

<option>Diseño web</option>
<option>Tienda online</option>
<option>Renovación de sitio web</option>
<option>Mantenimiento mensual</option>
<option>Otro</option>

</select>

<textarea
name="mensaje"
rows="7"
placeholder="Contanos un poco sobre tu proyecto">
</textarea>

<button
type="submit"
class="btn-primary">

Enviar consulta

</button>

</form>


<div class="hero-note">

✓ Presupuesto sin compromiso<br>
✓ Respuesta personalizada<br>
✓ Atención por WhatsApp o email

</div>


<div class="volver">

<a href="presupuesto.html" class="btn-secondary">

Volver

</a>

</div>

</div>

</section>

</body>
</html>
